# SearXNG settings for the voice agent: local, single user, JSON API on.
# install_searxng.py copies this to settings.local.yml (gitignored) and fills in secret_key.
use_default_settings: true

general:
  debug: false
  instance_name: "Voice Agent search"

server:
  secret_key: "__GENERATED__"
  bind_address: "127.0.0.1"
  port: 8888
  limiter: false          # no bot detection: only reachable from this machine
  public_instance: false
  image_proxy: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  formats:
    - html
    - json                 # required: without this /search?format=json returns 403

outgoing:
  request_timeout: 4.0
  max_request_timeout: 10.0
  pool_connections: 50
  pool_maxsize: 20

# Defaults already enable brave, startpage, wikipedia, wikidata, github, stackoverflow, arxiv.
# Google is opportunistic (its scraper breaks a few times a year); bing is off (weak relevance);
# duckduckgo/qwant are off because they captcha residential IPs quickly.
engines:
  - name: google
    disabled: false
  - name: bing
    disabled: true
  - name: qwant
    disabled: true
  - name: duckduckgo
    disabled: true
